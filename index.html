<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagerDuty Booth Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scenes.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <!-- 常時表示の背景（グリッド＋ゆっくり漂う光） -->
      <div class="ambient" aria-hidden="true">
        <div class="glow a"></div>
        <div class="glow b"></div>
        <div class="grid"></div>
        <div class="vignette"></div>
      </div>

      <header class="chrome-top">
        <div class="brand" id="brand"></div>
      </header>

      <main id="slides"></main>

      <div class="wipe" id="wipe" aria-hidden="true"></div>
      <div class="captions" id="captions" aria-live="polite"></div>

      <footer class="chrome-bottom">
        <div class="progress" id="progress"></div>
      </footer>

      <div class="paused-badge mono" id="pausedBadge">PAUSED</div>
      <button class="fs-btn" id="fsBtn" type="button"></button>
    </div>
  </div>

  <!-- 1) コンテンツ（ここを編集するだけでスライドを更新できます） -->
  <script src="content/slides.js"></script>
  <!-- 2) 共通ユーティリティ -->
  <script src="js/util.js"></script>
  <script src="js/media.js"></script>
  <!-- 3) シーン（スライドのテンプレート） -->
  <script src="js/scenes/title.js"></script>
  <script src="js/scenes/statement.js"></script>
  <script src="js/scenes/noise.js"></script>
  <script src="js/scenes/flow.js"></script>
  <script src="js/scenes/escalation.js"></script>
  <script src="js/scenes/ai.js"></script>
  <script src="js/scenes/dashboard.js"></script>
  <script src="js/scenes/stats.js"></script>
  <script src="js/scenes/cta.js"></script>
  <script src="js/scenes/video.js"></script>
  <!-- 4) 再生エンジン -->
  <script src="js/engine.js"></script>
</body>
</html>
